name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Session, transport and recovery fixtures
        run: python3 -B -m unittest discover
      - name: Search and time model fixtures
        run: |
          node test_search.js
          node test_time.js
